apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-init-sql
  namespace: vault
data:
  init.sql: |
    CREATE TABLE vault_kv_store (
      parent_path TEXT COLLATE "C" NOT NULL,
      path        TEXT COLLATE "C",
      key         TEXT COLLATE "C",
      value       BYTEA,
      CONSTRAINT pkey PRIMARY KEY (path, key)
    );

    CREATE INDEX parent_path_idx ON vault_kv_store (parent_path);

    CREATE TABLE vault_ha_locks (
      ha_key                                      TEXT COLLATE "C" NOT NULL,
      ha_identity                                 TEXT COLLATE "C" NOT NULL,
      ha_value                                    TEXT COLLATE "C",
      valid_until                                 TIMESTAMP WITH TIME ZONE NOT NULL,
      CONSTRAINT ha_key PRIMARY KEY (ha_key)
    );
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-init
  namespace: vault
spec:
  template:
    spec:
      containers:
        - name: psql
          image: alpine/psql:17.2
          command: [cat, /scripts/init.sql]
          volumeMounts:
            - mountPath: /scripts
              name: vault-init-sql
          restartPolicy: Never
      volumes:
        - name: vault-init-sql
          configMap:
            name: vault-init-sql
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: {{ .Values.common.namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: vault
    server: {{ .Values.common.cluster }}
  project: default
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault
      targetRevision: {{ .Values.vault.version }}
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
